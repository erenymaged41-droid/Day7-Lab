<!DOCTYPE html>
<html>
<head>
    <title>Fixed Navbar</title>

    <style>
        body {
            margin: 0;
            padding-top: 70px;
            height: 1500px;
        }

        ul {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            margin: 0;
            padding: 10px;
            background-color: black;
            list-style-type: none;
            z-index: 1000;
        }

        li {
            display: inline-block;
        }

        li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
        }

        li a:hover {
            background-color: gray;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <h1>Fixed Navbar</h1>

    <p>This is the content of the page.</p>

    <p>Scroll down to test the fixed navbar.</p>

    <p>
        This page contains enough content to allow scrolling.
    </p>

</body>
</html>
