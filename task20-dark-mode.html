<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 20 - Dark Mode Toggle</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
            --btn-bg: #0f172a;
            --btn-text: #ffffff;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --btn-bg: #38bdf8;
            --btn-text: #0f172a;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 340px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Task 20: Theme Switcher</h2>
    <p>Click the button below to toggle between Light Mode and Dark Mode dynamically.</p>
    <button class="toggle-btn" id="themeBtn" onclick="toggleTheme()">Switch to Dark Mode 🌙</button>
</div>

<script>
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById("themeBtn");

        body.classList.toggle("dark-mode");

        if (body.classList.contains("dark-mode")) {
            btn.textContent = "Switch to Light Mode ☀️";
        } else {
            btn.textContent = "Switch to Dark Mode 🌙";
        }
    }
</script>

</body>
</html>
