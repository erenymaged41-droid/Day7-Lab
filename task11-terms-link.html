<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 11 - Terms Checkbox</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; }
        .terms-container { display: flex; align-items: center; gap: 8px; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h2>Task 11: Terms and Conditions Link</h2>

    <form>
        <div class="terms-container">
            <input type="checkbox" id="accept-terms">
            <label for="accept-terms">
                I accept the <a href="https://www.w3schools.com" target="_blank">terms and conditions</a>
            </label>
        </div>
    </form>

</body>
</html>
