<!DOCTYPE html>
<html>
<head>
    <title>Captcha Validation</title>

    <style>
        #captcha {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            background-color: lightgray;
            padding: 10px;
            width: fit-content;
        }

        input {
            margin-top: 10px;
            padding: 8px;
        }

        button {
            margin-top: 10px;
            padding: 8px 15px;
        }
    </style>
</head>

<body>

    <h1>Captcha Validation</h1>

    <div id="captcha"></div>

    <br>

    <input type="text" id="captchaInput" placeholder="Enter Captcha">

    <br>

    <button onclick="validateCaptcha()">Validate</button>

    <p id="result"></p>

    <script>
        let captchaText = "";

        function generateCaptcha() {
            let characters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

            captchaText = "";

            for (let i = 0; i < 5; i++) {
                captchaText +=
                    characters.charAt(
                        Math.floor(Math.random() * characters.length)
                    );
            }

            document.getElementById("captcha").innerHTML =
                captchaText;
        }

        function validateCaptcha() {

            let userInput =
                document.getElementById("captchaInput").value;

            if (userInput.toUpperCase() === captchaText) {
                document.getElementById("result").innerHTML =
                    "Captcha Correct!";
            } else {
                document.getElementById("result").innerHTML =
                    "Captcha Incorrect!";

                generateCaptcha();
                document.getElementById("captchaInput").value = "";
            }
        }

        generateCaptcha();
    </script>

</body>
</html>
