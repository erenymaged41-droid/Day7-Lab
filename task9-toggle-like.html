<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9 - Toggle Like Button</title>
    <!-- مكتبة Font Awesome لإظهار أيقونة الـ Like -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .like-btn {
            font-size: 60px;
            cursor: pointer;
            color: #ccc; /* اللون الرمادي الافتراضي */
            transition: color 0.2s ease, transform 0.1s ease;
            user-select: none;
        }

        /* اللون الأزرق عند الضغط لتأكيد الإعجاب */
        .like-btn.liked {
            color: #1877f2;
        }

        .like-btn:active {
            transform: scale(1.2); /* تكبير بسيط عند الكليك */
        }
    </style>
</head>
<body>

    <h2>Task 9: Toggle Like Button</h2>
    
    <!-- أيقونة الـ Like -->
    <i onclick="toggleLike(this)" class="fa fa-thumbs-up like-btn"></i>

    <script>
        function toggleLike(element) {
            // إضافة أو إزالة الكلاس لتغيير اللون
            element.classList.toggle("liked");
        }
    </script>

</body>
</html>
